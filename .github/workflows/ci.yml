name: CI

# Builds and tests the addon on every platform we ship, and packs one
# self-contained tarball per platform. Nothing here touches npm: prebuilt
# binaries are published as GitHub Release assets on a `v*` tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The build job only reads the repository, and the release job asks for the wider
# `contents: write` on its own — so say the narrow thing here and let it be overridden
# where it is needed. A pull request from a fork then inherits nothing else.
permissions:
  contents: read

# A run that has been superseded answers a question nobody is asking any more, and a
# cold one compiles PROJ and GDAL from source; cancelling is worth it. Tags are exempt:
# a release build must not be cancelled by a later push that happens to share the ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # A CI runner never commits, so the husky `prepare` hook has nothing to guard.
  # Without this it still runs, and inside the musl container — where `/work` is a
  # bind mount with no `.git` — it prints
  #
  #     fatal: not in a git directory
  #
  # into the middle of an otherwise clean build log, where it reads like the build
  # failed. `scripts/ci-run.mjs` forwards this variable into the container by name.
  HUSKY: "0"

jobs:
  # The gates that need no GDAL: formatting, the TypeScript declarations, the
  # licence allow-list and the static documentation claims. They run on their own
  # so a style, type, licence or doc slip fails in about a minute, instead of at
  # the end of a matrix leg's 40-minute source build.
  checks:
    name: format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --all --check

      # `compat/index.d.ts` is a contract, and the TypeScript suite compiles against
      # it: a wrong declaration fails here rather than in a consumer's build.
      - name: Type-check the TypeScript suite
        run: npm run typecheck

      # Version parity, package contents, CHANGELOG and the README claims that do
      # not need a built addon.
      - name: Check documentation
        run: node scripts/check-docs.mjs --static

      # The dependency graph's licences, read from `Cargo.lock`. A new crate on a
      # licence that is not allow-listed fails here.
      - name: Check licences
        run: node scripts/check-licenses.mjs

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # A cold run compiles PROJ and GDAL from source. On a 4-core runner that is
    # far slower than on a 16-core workstation, hence the generous ceiling.
    timeout-minutes: 180
    # Every leg runs the same steps. The two musl legs are not a special case: they
    # differ only in their target, and `scripts/ci-run.mjs` re-enters a musl-native
    # Alpine container (docker/musl.Dockerfile) for the commands that touch the
    # addon, because a glibc Node cannot load a musl build. See that script.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
          - target: aarch64-apple-darwin
            runs-on: macos-latest # must be an arm64 image (macos-14 and newer)
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    env:
      # What `ci-run.mjs` reads to decide whether a command belongs in the container.
      CI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # clippy runs inside the linux-x64-gnu job so the lint gate does not need a
          # second full PROJ/GDAL build of its own; rustfmt lives in `checks`.
          components: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'clippy' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # PROJ's configure shells out to the `sqlite3` command line tool to build
      # proj.db; CMake drives the C/C++ build. See the README for why the msys2
      # copy of sqlite3 cannot be the one used on Windows.
      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build sqlite3 g++
          sqlite3 --version

      - name: Install prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          cmake --version
          sqlite3 --version

      - name: Install prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\SQLite\tools" >> $env:GITHUB_PATH
          & "C:\ProgramData\chocolatey\lib\SQLite\tools\sqlite3.exe" --version
          cmake --version
          ninja --version

      - uses: Swatinem/rust-cache@v2
        with:
          # The GDAL/PROJ objects live under target/, so this cache is the
          # difference between a 3 minute run and a 40 minute one. Keying on the
          # manifests means a driver-set change starts a clean build instead of
          # silently reusing stale objects.
          #
          # The architecture is part of `prefix-key` because a restore that misses
          # its exact key falls back to another leg's cache, and one built for
          # another architecture is at best useless.
          prefix-key: v0-rust-${{ runner.arch }}
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          cache-on-failure: true

      - name: Install npm dependencies
        run: node scripts/ci-run.mjs npm ci

      # The three Rust checks that compile the crate but need no linked GDAL: clippy,
      # the cross-target StatBuf type arms, and the pure-function unit tests (option
      # handling, sample-type dispatch, the geometry/field-type name maps). One step,
      # on the one leg that already pays for the PROJ/GDAL compile.
      #
      # The StatBuf mapping changes three times (Windows/Linux/macOS), and bugs in it
      # do not type-check on the platform you develop on; `cargo check` for each target
      # compiles the type arms without linking or a system GDAL.
      - name: Rust checks
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo clippy --release --target ${{ matrix.target }} --all-targets -- -D warnings
          rustup target add aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          cargo check --target aarch64-apple-darwin --lib 2>&1 | tail -1
          cargo check --target x86_64-unknown-linux-gnu --lib 2>&1 | tail -1
          cargo check --target aarch64-unknown-linux-gnu --lib 2>&1 | tail -1
          cargo test --release --target ${{ matrix.target }} --lib

      # `npm run build` is scripts/build.mjs: it drops MSYS2/Cygwin prefixes from
      # PATH, verifies sqlite3 is reachable, then drives `napi build` and stages
      # the PROJ/GDAL data files into assets/. On a musl leg it runs inside the
      # container, where the toolchain is musl-native — no cross toolchain, no
      # sysroot, and no `--use-cross` for napi to hand a wrong host triple to — and
      # where the dependency tree was installed to match.
      - name: Build
        run: node scripts/ci-run.mjs npm run build -- --target ${{ matrix.target }}

      # `pack-platform.mjs` takes the platform label from the built `.node`
      # filename, so a leg that quietly builds for its host instead of its target
      # produces a tarball that collides with another leg's — which is how the
      # v0.1.0 release ended up with four assets instead of six. Every leg now
      # builds on a runner of its own architecture, but a container or a cross
      # toolchain could still turn out a host build, so assert the label before
      # anything else runs.
      #
      # The triple-to-label mapping is in `scripts/platform.mjs`, which the two
      # packing scripts read too — so it is written down once rather than once
      # here and once in there. The script also exports `PLATFORM` to the
      # runner itself; doing that in Node rather than through a shell pipeline
      # keeps it working on the PowerShell legs, where `$GITHUB_ENV` is not a
      # variable and `tee` is not `tee(1)`.
      - name: Check the built platform
        run: node scripts/check-platform.mjs --target ${{ matrix.target }}

      # The runner's Node is a glibc binary and napi links musl dynamically (it
      # appends `-C target-feature=-crt-static` for any musl target), so a musl
      # addon cannot be dlopen'd here — one process, two libcs. `ci-run.mjs` is what
      # puts this inside the container rather than skipping it.
      - name: Test
        run: node scripts/ci-run.mjs npm test

      # Now that the addon is built, the README's runtime claims (the driver
      # count, the GDAL release string, `apiVersion`, the `features()` keys) can be
      # checked against the binary that will ship. On the one leg, as ever.
      - name: Check documentation claims
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node scripts/ci-run.mjs npm run check:docs

      # A CycloneDX inventory of the shipped artifact: the pinned crates plus the
      # native libraries linked into the `.node`. Attached to the release below.
      - name: Generate SBOM
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node scripts/ci-run.mjs npm run sbom

      # The coverage floor is what keeps a new member of the compatibility layer
      # from landing untested. It re-runs that suite alone (a couple of seconds) on
      # the one leg whose toolchain is already warm, so it does not multiply the
      # expensive part of the run.
      - name: Compatibility coverage
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node scripts/ci-run.mjs npm run test:coverage

      # The one benchmark that is also a check, on the one leg that is already through
      # its toolchain. `--min-speedup` gates the *ratio* between four dataset-free
      # transforms issued together and one at a time, which is lock contention and
      # nothing else: about 3x while the dataset-free work sits on the shared side of
      # the lock, about 1x if it ever moves back to the exclusive side. A ratio between
      # two measurements on the same runner is what makes a floor safe to fail on,
      # where a wall time would not be — and the floor is set well below the measured
      # value for the same reason. The numbers themselves are archived rather than
      # only asserted: this run's summary and a `bench.log` artifact, which is the
      # trend the roadmap asks for.
      - name: Benchmark the lock
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -o pipefail
          # `dist/` is the build-output directory and is git-ignored, so the log goes
          # there rather than into the repository root.
          mkdir -p dist
          # `|| status=$?` keeps a failure from ending the step before the log has been
          # archived, and because of `pipefail` it is the benchmark's status, not tee's.
          status=0
          node scripts/bench-parallel.mjs --min-speedup 1.5 2>&1 | tee dist/bench.log || status=$?
          {
            echo '### Lock benchmark'
            echo
            echo '`scripts/bench-parallel.mjs --min-speedup 1.5`'
            echo
            echo '```'
            cat dist/bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v5
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: lock-benchmark
          path: dist/bench.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

      # One installable tarball per platform (root package files + assets/ + the
      # binary, with os/cpu/libc set so npm refuses a mismatched machine), and the
      # npm-format packages: the root package plus one `gdal-rs-napi-<platform>` per
      # binary. Nothing is published to npm yet (the package is still `private`), but
      # the packing runs on every build so the layout cannot rot before it is; the
      # npm-format packages are not uploaded.
      - name: Pack
        run: |
          node scripts/ci-run.mjs npm run pack
          node scripts/ci-run.mjs npm run pack:npm

      # The claim this package makes is "nothing on the host", so prove it: install
      # the artifact into an empty directory and use it. A CI runner is a clean
      # machine, which is exactly the machine the claim is about.
      #
      # Running this on the host for a musl leg fails the install outright:
      #
      #     npm error code EBADPLATFORM
      #     npm error notsup Unsupported platform for gdal-rs-napi@0.1.0:
      #     wanted {"os":"linux","cpu":"x64","libc":"musl"}
      #     (current: {"os":"linux","cpu":"x64","libc":"glibc"})
      #
      # because a musl build cannot be installed on a glibc host, whatever its
      # contents — that is npm refusing the combination, not a defect in the tarball.
      # `ci-run.mjs` puts it where the libc is the one the tarball was built for.
      - name: Smoke-test the packed tarball
        run: node scripts/ci-run.mjs npm run smoke

      # GEOS is LGPL-2.1 and is linked statically into the `.node`, so LGPL-2.1 §6
      # asks this release for the means to relink it against a modified GEOS:
      # `scripts/lgpl-geos.mjs` gathers the source this build compiled, the
      # archives it produced, and a relink note. It is a second tarball with the
      # platform in its name, so the release job below picks it up unchanged —
      # see THIRD-PARTY.md.
      - name: LGPL materials
        run: node scripts/ci-run.mjs npm run lgpl

      - uses: actions/upload-artifact@v5
        with:
          name: gdal-rs-napi-${{ matrix.target }}-${{ env.PLATFORM }}
          path: |
            *.node
            dist/*.tgz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No actions/checkout here on purpose: this job only needs the artifacts.
      # That is also why GH_REPO has to be set below — `gh` infers the repository
      # from the git remote, and without a checkout there is none to infer from,
      # so `gh release create` fails immediately.
      #
      # `merge-multiple: false` keeps each artifact in its own directory. Merging
      # them would silently overwrite a tarball whose name another leg produced,
      # which is how a release can end up quietly missing an asset.
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: false

      - name: Publish the tarballs as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes

          count=$(find artifacts -name '*.tgz' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no tarballs were downloaded, so there is nothing to publish" >&2
            exit 1
          fi
          echo "publishing $count tarball(s)"

          # Two legs producing the same tarball name means one of them built the
          # wrong target. Refuse rather than let `--clobber` pick a winner.
          duplicates=$(find artifacts -name '*.tgz' -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "these tarball names came from more than one leg:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

          find artifacts -name '*.tgz' -print -exec gh release upload "$tag" {} --clobber \;

          # The SBOM travels with the release: the tarballs say what the code
          # does, this says what is inside it.
          find artifacts -name 'sbom.cdx.json' -print -exec gh release upload "$tag" {} --clobber \;
