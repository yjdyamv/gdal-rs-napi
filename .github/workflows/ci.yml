name: CI

# Builds and tests the addon on every platform we ship, and packs one
# self-contained tarball per platform. Nothing here touches npm: prebuilt
# binaries are published as GitHub Release assets on a `v*` tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # A cold run compiles PROJ and GDAL from source. On a 4-core runner that is
    # far slower than on a 16-core workstation, hence the generous ceiling.
    timeout-minutes: 180
    # The musl targets are cross-built in a cross-rs container (napi's
    # `--use-cross`) and are the least settled part of the matrix. They are
    # allowed to fail without turning the whole run red while that is shaken out.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
          - target: aarch64-apple-darwin
            runs-on: macos-latest # must be an arm64 image (macos-14 and newer)
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            cross: true
            experimental: true
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            cross: true
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # rustfmt and clippy run inside the linux-x64-gnu job so that the style
          # gate does not need a second full PROJ/GDAL build of its own.
          components: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'rustfmt,clippy' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # PROJ's configure shells out to the `sqlite3` command line tool to build
      # proj.db; CMake drives the C/C++ build. See the README for why the msys2
      # copy of sqlite3 cannot be the one used on Windows.
      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build sqlite3 g++
          sqlite3 --version

      - name: Install prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          cmake --version
          sqlite3 --version

      - name: Install prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\SQLite\tools" >> $env:GITHUB_PATH
          & "C:\ProgramData\chocolatey\lib\SQLite\tools\sqlite3.exe" --version
          cmake --version
          ninja --version

      # The musl legs build through napi's `--use-cross`, which shells out to
      # cross-rs, so that has to be on PATH (and a container engine has to be
      # present, which the GitHub Linux runners have). cross is what makes the
      # vendored C libraries the all-drivers set pulls in — HDF5, netCDF, curl,
      # libpq — cross-configure at all: it drives a real musl sysroot, so the
      # CMake and configure steps those libraries run get a toolchain instead of
      # a bare `zig cc`.
      - name: Install cross (musl cross builds)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          # The GDAL/PROJ objects live under target/, so this cache is the
          # difference between a 3 minute run and a 40 minute one. Keying on the
          # manifests means a driver-set change starts a clean build instead of
          # silently reusing stale objects.
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --release --target ${{ matrix.target }} --all-targets -- -D warnings

      # Pure-function unit tests (option handling, sample-type dispatch, the
      # geometry/field-type name maps). They need no GDAL runtime and are cheap;
      # one platform is enough to cover them.
      - name: Rust unit tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release --target ${{ matrix.target }} --lib

      # `npm run build` is scripts/build.mjs: it drops MSYS2/Cygwin prefixes from
      # PATH, verifies sqlite3 is reachable, then drives `napi build` and stages
      # the PROJ/GDAL data files into assets/.
      - name: Build
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.cross && '--use-cross' || '' }}

      # `pack-platform.mjs` takes the platform label from the built `.node`
      # filename, so a leg that quietly builds for its host instead of its target
      # produces a tarball that collides with another leg's — which is how the
      # v0.1.0 release ended up with four assets instead of six. On the native
      # runners host and target are the same thing, so only the two musl legs
      # could hide it. Assert the label before anything else runs.
      - name: Check the built platform
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)    expected=win32-x64-msvc ;;
            aarch64-apple-darwin)      expected=darwin-arm64 ;;
            x86_64-unknown-linux-gnu)  expected=linux-x64-gnu ;;
            aarch64-unknown-linux-gnu) expected=linux-arm64-gnu ;;
            x86_64-unknown-linux-musl) expected=linux-x64-musl ;;
            aarch64-unknown-linux-musl) expected=linux-arm64-musl ;;
            *) echo "no expected platform known for ${{ matrix.target }}" >&2; exit 1 ;;
          esac

          actual=$(basename "$(ls ./*.node)" .node)
          actual=${actual#gdal-rs-napi.}
          echo "target=${{ matrix.target }} expected=$expected actual=$actual"
          ls -l ./*.node
          echo "PLATFORM=$actual" >> "$GITHUB_ENV"

          if [ "$actual" != "$expected" ]; then
            echo "::error::the binary is labelled $actual but ${{ matrix.target }} should give $expected"
            exit 1
          fi

      # Run the suite only where the runner can load what it built. napi's cross
      # toolchain deliberately links musl dynamically (it appends
      # `-C target-feature=-crt-static` for any musl target), so this addon needs
      # musl's own libc at load time — and the Node on this runner is a glibc
      # binary. Two libcs in one process is not a thing, so the gnu Node cannot
      # dlopen it. That is a property of the artifact, not a reason to skip it.
      - name: Test
        if: ${{ !matrix.cross }}
        run: npm test

      # So test it where musl is the native libc. Inside the container the
      # generated loader also resolves to musl, so this runs the real artifact
      # rather than a host build wearing a musl label — which is what these legs
      # were doing before, quietly passing every test against a glibc binary.
      - name: Test (musl)
        if: matrix.cross
        run: docker run --rm -v "$PWD:/work" -w /work node:24-alpine npm test

      # One installable tarball per platform: root package files + assets/ + the
      # binary, with os/cpu/libc set so npm refuses a mismatched machine. Run
      # through npm so the script can find the npm CLI without a shell.
      - name: Pack
        run: npm run pack

      - uses: actions/upload-artifact@v5
        with:
          name: gdal-rs-napi-${{ matrix.target }}-${{ env.PLATFORM }}
          path: |
            *.node
            dist/*.tgz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No actions/checkout here on purpose: this job only needs the artifacts.
      # That is also why GH_REPO has to be set below — `gh` infers the repository
      # from the git remote, and without a checkout there is none to infer from,
      # so `gh release create` fails immediately.
      #
      # `merge-multiple: false` keeps each artifact in its own directory. Merging
      # them would silently overwrite a tarball whose name another leg produced,
      # which is how a release can end up quietly missing an asset.
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: false

      - name: Publish the tarballs as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes

          count=$(find artifacts -name '*.tgz' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no tarballs were downloaded, so there is nothing to publish" >&2
            exit 1
          fi
          echo "publishing $count tarball(s)"

          # Two legs producing the same tarball name means one of them built the
          # wrong target. Refuse rather than let `--clobber` pick a winner.
          duplicates=$(find artifacts -name '*.tgz' -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "these tarball names came from more than one leg:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

          find artifacts -name '*.tgz' -print -exec gh release upload "$tag" {} --clobber \;
