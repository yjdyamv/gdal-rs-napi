[package]
name = "gdal-rs-napi"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Node.js bindings for GDAL, built on the gdal / gdal-sys Rust crates with a self-contained static GDAL + PROJ"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
  "napi4",
  "dyn-symbols",
  "serde-json",
] }
napi-derive = "3"
gdal = "0.19"
gdal-sys = "0.12"
gdal-src = { version = "0.3", optional = true, default-features = false }
proj-sys = "0.27"
serde_json = "1"
# `gdal_sys::VSIStatBufL` is a platform-dependent typedef — `_stat64` on
# Windows, the POSIX `stat64` on Linux and macOS — and the two do not have the
# same fields. `libc` is where the cross-platform accessors for that struct
# live (`st_size` / `st_mode` / `st_mtime`), which is what `fs::stat` reads
# through. It is already in the tree transitively; this makes it direct.
libc = "0.2"

# The curl-backed drivers (WMS, WMTS, WCS, OGCAPI, PLMOSAIC, Carto,
# Elasticsearch, NGW, AmigoCloud, DAAS, EEDA) need libcurl with TLS. On the four
# native targets libcurl links the *system* OpenSSL, but there is nothing
# linkable under musl — so build one and link it statically. `static-ssl` is
# curl-sys's own switch for that: it flips `openssl-sys` to its `vendored`
# feature, which compiles OpenSSL from source for the target. This direct
# dependency exists only to turn that feature on, and only for musl, so the other
# legs keep using their system OpenSSL exactly as before.
[target.'cfg(target_env = "musl")'.dependencies]
curl-sys = { version = "0.4.84", features = ["static-ssl"] }

[build-dependencies]
napi-build = "2"

[features]
default = ["bundled"]
bundled = [
  "dep:gdal-src",
  "gdal-sys/bundled",
  # Everything gdal-src can switch on, which is what this package ships: the
  # internal drivers (GTiff, PNG, JPEG, VRT, MEM, the shapefile/GeoJSON family…),
  # sqlite/GPKG/VFK, HDF5 and netCDF, the curl-backed network drivers, and
  # PostgreSQL. Their dependencies are all static or bundled, so an installed
  # package still needs no GDAL on the host.
  #
  # GEOS is deliberately not here. It is a separate feature in gdal-src, and
  # statically linking an LGPL library would relicense this whole artifact; with
  # `geos` unset, gdal-src's build.rs defines GDAL_USE_GEOS=OFF. The cost is the
  # OGR geometry predicates (ST_Intersects, ST_Buffer, -simplify) — a capability
  # gap by choice, not an oversight.
  "gdal-src/all_drivers",
  # `driver_pds` is not here even though gdal-src's build.rs wires it up: the
  # published crate does not ship frmts/pds/data, so enabling it fails the
  # configure step on two missing files. That is why all_drivers leaves it out,
  # and it is the one driver this package cannot offer.
  #
  # GEOS is, for the same reason as the rest of this list: it is fetched and
  # compiled by `geos-src` during the build, so an installed package needs
  # nothing on the host for it either.
  "geos",
]
# A curated driver set instead of `all_drivers`: the internal raster/vector
# drivers plus SQLite/GPKG/VFK, with GEOS. It drops the vendored HDF5, netCDF,
# the curl-backed network drivers and PostgreSQL/PostGIS, which are the fragile
# part of the musl build and a large part of the `.node`. It is opt-in — build
# with `--no-default-features --features bundled-lean`; the default stays full.
# See `docs/MUSL-LEAN.md` for what it keeps, drops, and why.
bundled-lean = [
  "dep:gdal-src",
  "gdal-sys/bundled",
  "gdal-src/internal_drivers",
  "gdal-src/driver_sqlite",
  "gdal-src/driver_gpkg",
  "gdal-src/driver_vfk",
  "geos",
]
# The GEOS build — GDAL's geometry predicates and algorithms (`intersects`,
# `buffer`, `simplify`, …), which GDAL implements through GEOS.
#
# It is built the way GDAL and PROJ are: `geos-src` fetches GEOS and compiles it,
# `gdal-src/geos_static` links it into the static GDAL, and the whole thing ends
# up inside the one `.node`. That keeps the package a single self-contained
# artifact, which is the point of the package — a *shared* GEOS (`gdal-src/geos`)
# would mean shipping platform-specific libraries and teaching each platform's
# loader where to find them, and on Windows/MSVC it does not work at all: the
# only GEOS a Windows box tends to have is MinGW's, whose import libraries an
# MSVC link cannot use.
#
# GEOS is LGPL-2.1 rather than MIT, and static linking is what makes that a
# licensing question instead of a non-question: LGPL-2.1 §6 asks a distributor of
# a statically linked work for the means to relink it against a modified GEOS.
# `docs/GEOS.md` records the decision and what the release owes. This affects the
# *release*, not the source — this crate's own licence does not change.
geos = ["dep:gdal-src", "gdal-src/geos_static"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3

[lints.rust.unexpected_cfgs]
level = "warn"
# `build.rs` sets this from `DEP_GDAL_VERSION_NUMBER`, because `gdal` gates
# `ThreadSafeDataset` on GDAL >= 3.10 behind a `cfg` we cannot observe from here.
check-cfg = ['cfg(gd_thread_safe)']
