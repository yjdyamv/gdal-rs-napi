# cross-rs configuration. Only the two musl legs use it, through napi's
# `--use-cross`.
#
# The cross images ship a full musl C/C++ toolchain (which is exactly what the
# vendored HDF5, netCDF, curl and libpq that `all_drivers` pulls in need) but no
# `ninja`. This project pins `CMAKE_GENERATOR = Ninja` in `.cargo/config.toml` for
# MSVC, and the container inherits that pin because cross bind-mounts the project
# and the container's cargo reads that same file — so every CMake configure in
# there dies with:
#
#   CMake Error: CMake was unable to find a build program corresponding to
#   "Ninja".  CMAKE_MAKE_PROGRAM is not set.
#
# The first CMake build cargo reaches is the vendored HDF5, which is where the
# musl legs have been failing since the driver set became `all_drivers`.
#
# Installing ninja is cheaper and narrower than dropping the pin: the images are
# Ubuntu, and the alternative — making the generator platform-conditional — would
# also change how the four native legs build.
#
# `perl` is for the next thing cargo reaches: the curl driver family needs
# libcurl with TLS, and under musl that OpenSSL is built from source (see the
# `static-ssl` switch in Cargo.toml), whose Configure is a Perl script.
[target.x86_64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install -y --no-install-recommends ninja-build perl"]

[target.aarch64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install -y --no-install-recommends ninja-build perl"]
